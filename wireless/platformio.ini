; PlatformIO Project Configuration File
; 双环境支持：ESP32-S3 (手环发射端) 与 ESP32-C3 (底座接收端)

[platformio]
; 默认构建环境 (需要烧录 C3 时可在此改为 receiver_c3，或在 VSCode 状态栏切换)
; default_envs = receiver_c3
default_envs = transmitter_s3
; ==============================================================================
; 1. 手环端环境配置 (ESP32-S3FN4, 内置 4MB Flash, 无外部 PSRAM)
; ==============================================================================
[env:transmitter_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600

; 4MB Flash 分区与硬件设置
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_qspi

; 自动注入角色宏：发射端
build_flags = 
    -D ROLE_TRANSMITTER=1
    -D ROLE_RECEIVER=2
    -D CURRENT_ROLE=1

; ==============================================================================
; 2. 接收端环境配置 (ESP32-C3)
; ==============================================================================
[env:receiver_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 921600

; C3 常用标准 4MB Flash 设置
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB

; 自动注入角色宏：接收端
build_flags = 
    -D ROLE_TRANSMITTER=1
    -D ROLE_RECEIVER=2
    -D CURRENT_ROLE=2
